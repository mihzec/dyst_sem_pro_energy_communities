name: energie.communities
services:
  database:
    image: postgres:alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=disysuser
      - POSTGRES_PASSWORD=disyspw

  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'

  energie.server:
    image: energie.server:${APP_VERSION}
    ports:
      - '8080:8080'
    depends_on:
      - database
      - rabbitmq

  energie.producer:
    image: energie.producer:${APP_VERSION}
    ports:
      - '8081:8080'
    depends_on:
      - database
      - rabbitmq

  energie.user:
    image: energie.user:${APP_VERSION}
    ports:
      - '8082:8080'
    depends_on:
      - database
      - rabbitmq

  current.percentage.service:
    image: current.percentage.service:${APP_VERSION}
    ports:
      - '8083:8080'
    depends_on:
      - database
      - rabbitmq

  usage.service:
    image: usage.service:${APP_VERSION}
    ports:
      - '8084:8080'
    depends_on:
      - database
      - rabbitmq
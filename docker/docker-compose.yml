name: energy.communities
services:
  database:
    image: postgres:alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=disysuser
      - POSTGRES_PASSWORD=disyspw
      - POSTGRES_DB=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'

  energy.server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: energy.server
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/postgres
      - SPRING_DATASOURCE_USERNAME=disysuser
      - SPRING_DATASOURCE_PASSWORD=disyspw
    ports:
      - '8080:8080'
    depends_on:
      database:
        condition: service_healthy

  energy.producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: energy.producer
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - TZ=Europe/Vienna
    ports:
      - '8081:8080'

  energy.user:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: energy.user
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - TZ=Europe/Vienna
    ports:
      - '8082:8080'

  current.percentage.service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: current.percentage.service
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/postgres
      - SPRING_DATASOURCE_USERNAME=disysuser
      - SPRING_DATASOURCE_PASSWORD=disyspw
    ports:
      - '8083:8080'
    depends_on:
      database:
        condition: service_healthy

  usage.service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: usage.service
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/postgres
      - SPRING_DATASOURCE_USERNAME=disysuser
      - SPRING_DATASOURCE_PASSWORD=disyspw
      - TZ=Europe/Vienna
    ports:
      - '8084:8080'
    depends_on:
      database:
        condition: service_healthy
name: energy.communities
services:
  database:
    image: postgres:alpine
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=disysuser
      - POSTGRES_PASSWORD=disyspw

  rabbitmq:
    image: rabbitmq:management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 15s

  energy.server:
    image: energy.server:${APP_VERSION}
    ports:
      - '8080:8080'
    depends_on:
      - database
      - rabbitmq

  energy.producer:
    image: energy.producer:${APP_VERSION}
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - '8081:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_started

  energy.user:
    image: energy.user:${APP_VERSION}
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - '8082:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_started

  current.percentage.service:
    image: current.percentage.service:${APP_VERSION}
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - '8083:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_started

  usage.service:
    image: usage.service:${APP_VERSION}
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    ports:
      - '8084:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_started